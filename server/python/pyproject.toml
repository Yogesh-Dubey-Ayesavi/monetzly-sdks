[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monetzly-sdk"
version = "3.0.0"
description = "Monetzly Python SDK — Mode B native ad integration for LLM applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Monetzly", email = "support@monetzly.com"}]
keywords = ["monetzly", "ads", "sdk", "llm", "streaming", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/monetzly/python-sdk"
Repository = "https://github.com/monetzly/python-sdk.git"
Issues = "https://github.com/monetzly/python-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["monetzly*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
